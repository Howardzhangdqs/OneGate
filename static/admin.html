<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token 管理</title>
  <link rel="stylesheet" href="/static/common.css?v=6">
  <script src="/static/header.js?v=2"></script>
  <style>
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #30363d;
      border-radius: 8px
    }

    table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse
    }

    th {
      padding: 10px 14px;
      text-align: center;
      white-space: nowrap
    }

    td {
      padding: 8px 14px;
      vertical-align: middle;
      text-align: center
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px
    }

    .toolbar h2 {
      font-size: 14px;
      color: #8b949e
    }

    .token-cell {
      text-align: left;
      font-family: var(--font-all);
      font-size: 12px;
      word-break: break-all;
      color: #79c0ff;
      cursor: pointer
    }

    .token-tip {
      position: fixed;
      z-index: 500;
      background: #1c2128;
      border: 1px solid #30363d;
      color: #79c0ff;
      font-family: var(--font-all);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      display: none
    }

    .token-tip.show {
      display: block
    }

    .usage-tip {
      position: fixed;
      z-index: 500;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: 12px;
      padding: 10px 12px;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(0,0,0,.4);
      display: none;
      min-width: 280px
    }

    .usage-tip.show {
      display: block
    }

    .usage-tip .ut-title {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 8px;
      letter-spacing: .5px
    }

    .usage-tip table {
      width: 100%;
      border-collapse: collapse;
      background: transparent
    }

    .usage-tip th,
    .usage-tip td {
      padding: 3px 8px 3px 0;
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      background: transparent
    }

    .usage-tip th:first-child,
    .usage-tip td:first-child {
      text-align: left;
      padding-left: 0
    }

    .usage-tip th:last-child,
    .usage-tip td:last-child {
      padding-right: 0
    }

    .usage-tip thead th {
      color: #8b949e;
      font-weight: 500;
      font-size: 11px;
      border-bottom: 1px solid #30363d;
      padding-bottom: 5px;
      background: transparent
    }

    .usage-tip .ut-prov {
      color: #58a6ff;
      font-weight: 600
    }

    .usage-tip tr.ut-total td {
      border-top: 1px solid #30363d;
      padding-top: 6px;
      color: #c9d1d9;
      font-weight: 600
    }

    .usage-tip tr.ut-total .ut-prov {
      color: #3fb950
    }

    .usage-tip .ut-in { color: #d29922 }
    .usage-tip .ut-out { color: #58a6ff }
    .usage-tip .ut-cr { color: #3fb950 }
    .usage-tip .ut-cw { color: #f85149 }
    .usage-tip .ut-empty { color: #8b949e; font-style: italic; text-align: left }

    .usage-tip .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 6px;
      vertical-align: middle
    }

    .usage-tip .dot-in { background: #d29922 }
    .usage-tip .dot-out { background: #58a6ff }
    .usage-tip .dot-cr { background: #3fb950 }
    .usage-tip .dot-cw { background: #f85149 }

    .usage-cell {
      cursor: help;
      padding: 6px 14px
    }

    .limits-cell {
      cursor: help;
      padding: 6px 14px
    }

    .rl-pill {
      display: inline-block;
      background: rgba(31, 111, 235, .15);
      color: #58a6ff;
      border: 1px solid rgba(31, 111, 235, .4);
      padding: 1px 9px;
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap
    }

    .usage-cell .uc-num {
      font-size: 12px;
      color: #c9d1d9;
      line-height: 1.3
    }

    .usage-cell .uc-num .tk-in { color: #d29922 }
    .usage-cell .uc-num .tk-out { color: #58a6ff }
    .usage-cell .uc-num .tk-cr { color: #3fb950 }

    .mini-stack {
      display: flex;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      background: #21262d;
      margin: 2px 0 0
    }

    .mini-stack .seg {
      height: 100%;
      min-width: 0
    }

    .mini-stack .seg-in { background: #d29922 }
    .mini-stack .seg-out { background: #58a6ff }
    .mini-stack .seg-cr { background: #3fb950 }
    .mini-stack .seg-cw { background: #f85149 }

    .providers-cell {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center
    }

    .tag-admin {
      border-color: #a371f7;
      color: #a371f7
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600
    }

    .badge-admin {
      background: #1f1035;
      color: #a371f7;
      border: 1px solid #a371f7
    }

    .badge-user {
      background: #0d1117;
      color: #8b949e;
      border: 1px solid #30363d
    }

    .toggle {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0
    }

    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #30363d;
      transition: .2s;
      border-radius: 20px
    }

    .toggle .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background: #8b949e;
      transition: .2s;
      border-radius: 50%
    }

    .toggle input:checked+.slider {
      background: #238636
    }

    .toggle input:checked+.slider:before {
      transform: translateX(16px);
      background: #fff
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .6);
      z-index: 100;
      justify-content: center;
      align-items: center
    }

    .modal-overlay.active {
      display: flex
    }

    .confirm-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .6);
      z-index: 300;
      justify-content: center;
      align-items: center
    }

    .confirm-overlay.active {
      display: flex
    }

    .confirm-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 360px;
      max-width: 90vw
    }

    .confirm-box p {
      font-size: 14px;
      color: #c9d1d9;
      margin-bottom: 20px;
      word-break: break-all
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end
    }

    .modal {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 90vw;
      max-height: 92vh;
      overflow-y: auto
    }

    .modal h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #c9d1d9
    }

    .form-group {
      margin-bottom: 14px
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
      letter-spacing: .5px
    }

    .form-group input[type=text] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-family: var(--font-all)
    }

    .rl-input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 13px
    }

    .rl-label {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 2px;
      display: block
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #c9d1d9;
      cursor: pointer;
      padding: 4px 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      transition: background .15s
    }

    .checkbox-group label:hover {
      background: #1c2128
    }

    .checkbox-group input[type=checkbox] {
      accent-color: #238636
    }

    .checkbox-group.scroll {
      max-height: 160px;
      overflow-y: auto;
      padding: 2px
    }

    .form-hint {
      font-size: 11px;
      color: #8b949e;
      margin-top: 6px;
      line-height: 1.5
    }

    a.btn {
      text-decoration: none
    }

    .models-cell {
      display: inline-block;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
      font-size: 11px;
      color: #8b949e
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 20px
    }

    .copy-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
      cursor: pointer;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      transition: background .15s
    }

    .copy-btn:hover {
      color: #58a6ff;
      background: #30363d
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .toast {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      color: #fff;
      opacity: 0;
      transform: translateX(40px);
      transition: opacity .3s, transform .3s;
      max-width: 400px;
      word-break: break-word
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0)
    }

    .toast-error {
      background: #da3633;
      border: 1px solid #f85149
    }

    .toast-success {
      background: #238636;
      border: 1px solid #2ea043
    }

    .login-overlay {
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d1117;
      z-index: 400;
      justify-content: center;
      align-items: center
    }

    .login-overlay.hidden {
      display: none
    }

    .login-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      width: 400px;
      max-width: 90vw
    }

    .login-box h2 {
      font-size: 20px;
      color: #58a6ff;
      margin-bottom: 20px
    }

    .login-box .form-group {
      margin-bottom: 16px
    }

    .login-box .form-group label {
      margin-bottom: 8px
    }

    .login-box .form-group input {
      padding: 10px 12px;
      font-size: 14px
    }

    .login-box .error-msg {
      color: #f85149;
      font-size: 12px;
      min-height: 18px;
      margin-top: 8px
    }

    .login-box .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      color: #8b949e;
      cursor: pointer
    }

    .login-box .remember-row input {
      accent-color: #238636
    }

    .admin-content {
      display: none
    }

    .admin-content.active {
      display: block
    }
  </style>
</head>

<body>
  <div class="toast-container" id="toast-container"></div>
  <div class="token-tip" id="token-tip"></div>
  <div class="usage-tip" id="usage-tip"></div>

  <div class="login-overlay" id="login-overlay">
    <div class="login-box">
      <h2>管理员登录</h2>
      <div class="form-group">
        <label>管理员 Token</label>
        <input type="text" id="login-token" placeholder="请输入管理员 Token…" autofocus>
      </div>
      <label class="remember-row"><input type="checkbox" id="login-remember" checked>记住我</label>
      <button class="btn btn-primary" style="width:100%;padding:10px" onclick="doLogin()">登录</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </div>

  <div class="admin-content" id="admin-content">
    <div id="og-header"></div>
    <script>
      OneGateHeader.mount('#og-header', {
        active: 'admin',
        title: 'Token 管理',
        actions: '<div class="info" id="stats"></div><a class="btn btn-sm" href="/models">模型目录</a><button class="btn btn-sm" onclick="doLogout()">退出登录</button>'
      });
    </script>
    <div class="container">
      <div class="toolbar">
        <h2 id="token-count"></h2>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="loadTokens()">刷新</button>
          <button class="btn btn-primary" onclick="showCreateModal()">+ 新建 Token</button>
        </div>
      </div>
      <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Token</th>
            <th>描述</th>
            <th>提供商</th>
            <th>模型</th>
            <th>管理员</th>
            <th>已启用</th>
            <th>速率限制</th>
            <th>5h</th>
            <th>1d</th>
            <th>7d</th>
            <th>创建时间</th>
            <th>常用工具</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="token-tbody"></tbody>
      </table>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h3 id="modal-title">新建 Token</h3>
        <div class="form-group">
          <label>Token（留空自动生成）</label>
          <input type="text" id="modal-token" placeholder="自动生成">
        </div>
        <div class="form-group">
          <label>描述</label>
          <input type="text" id="modal-describe" placeholder="描述该 Token 的用途..." style="font-family:var(--font-all)">
        </div>
        <div class="form-group">
          <label>提供商</label>
          <div class="checkbox-group" id="modal-providers"></div>
        </div>
        <div class="form-group">
          <label>可见模型</label>
          <div class="checkbox-group scroll" id="modal-models"></div>
          <div class="form-hint" id="modal-models-hint">勾选的 id 是该 Token 在 /v1/models 中唯一可见的模型。*（全部模型）会暴露整个目录。</div>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:10px">
          <label style="margin:0;text-transform:none;font-size:13px;color:#c9d1d9">管理员</label>
          <label class="toggle">
            <input type="checkbox" id="modal-admin">
            <span class="slider"></span>
          </label>
        </div>
        <div class="form-group" style="margin-top:8px">
          <label>速率限制（-1 = 不限制，0 = 不允许；token 限额单位为 M）</label>
          <div style="font-size:11px;color:#8b949e;margin-top:6px;margin-bottom:2px">请求</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div><label class="rl-label">RPM</label><input type="number" id="modal-rpm" value="-1" class="rl-input"></div>
            <div><label class="rl-label">RPH</label><input type="number" id="modal-rph" value="-1" class="rl-input"></div>
            <div><label class="rl-label">RPD</label><input type="number" id="modal-rpd" value="-1" class="rl-input"></div>
            <div><label class="rl-label">RPW</label><input type="number" id="modal-rpw" value="-1" class="rl-input"></div>
            <div><label class="rl-label">RP月</label><input type="number" id="modal-rpmo" value="-1" class="rl-input"></div>
            <div><label class="rl-label">RPT</label><input type="number" id="modal-rpt" value="-1" class="rl-input"></div>
          </div>
          <div style="font-size:11px;color:#8b949e;margin-top:8px;margin-bottom:2px">Token（M）</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <div><label class="rl-label">TPM</label><input type="number" step="any" id="modal-tpm" value="-1" class="rl-input"></div>
            <div><label class="rl-label">TPH</label><input type="number" step="any" id="modal-tph" value="-1" class="rl-input"></div>
            <div><label class="rl-label">TPD</label><input type="number" step="any" id="modal-tpd" value="-1" class="rl-input"></div>
            <div><label class="rl-label">TPW</label><input type="number" step="any" id="modal-tpw" value="-1" class="rl-input"></div>
            <div><label class="rl-label">TP月</label><input type="number" step="any" id="modal-tpmo" value="-1" class="rl-input"></div>
            <div><label class="rl-label">TPT</label><input type="number" step="any" id="modal-tpt" value="-1" class="rl-input"></div>
          </div>
          <div style="font-size:11px;color:#8b949e;margin-top:8px;margin-bottom:2px">缓存 token 权重（-1 = 继承全局）</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div><label class="rl-label">cache_read</label><input type="number" step="any" id="modal-cache_read_weight" value="-1" class="rl-input"></div>
            <div><label class="rl-label">cache_write</label><input type="number" step="any" id="modal-cache_write_weight" value="-1" class="rl-input"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="hideModal()">取消</button>
          <button class="btn btn-primary" id="modal-submit" onclick="submitModal()">创建</button>
        </div>
      </div>
    </div>

    <div class="confirm-overlay" id="confirm-overlay">
      <div class="confirm-box">
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button class="btn" onclick="confirmCancel()">取消</button>
          <button class="btn btn-danger" id="confirm-ok" onclick="confirmOk()">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PROVIDERS = /*__PROVIDERS__*/;
    const API_BASE = '';
    let adminToken = null;
    let editingToken = null;
    let catalogModels = null;

    function apiHeaders() {
      return { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken };
    }

    async function api(method, path, body) {
      const opts = { method, headers: apiHeaders() };
      if (body !== undefined && body !== null) opts.body = JSON.stringify(body);
      const resp = await fetch(API_BASE + path, opts);
      const data = await resp.json();
      return { ok: resp.ok, status: resp.status, data };
    }

    function toast(msg, type) {
      type = type || 'error';
      const el = document.createElement('div');
      el.className = 'toast toast-' + type;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    function fmtDate(ts) {
      if (!ts) return '-';
      const d = new Date(ts * 1000);
      return d.toLocaleDateString('zh-CN') + ' ' + d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function copyToken(token) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(token).then(() => toast('Token 已复制', 'success')).catch(() => fallbackCopy(token));
      } else {
        fallbackCopy(token);
      }
    }

    function fallbackCopy(token) {
      const ta = document.createElement('textarea');
      ta.value = token;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('Token 已复制', 'success'); }
      catch (e) { toast('复制失败', 'error'); }
      document.body.removeChild(ta);
    }

    (function () {
      const tip = document.getElementById('token-tip');
      const utip = document.getElementById('usage-tip');

      function positionTip(el, e) {
        let x = e.clientX + 14;
        let y = e.clientY + 14;
        const rect = el.getBoundingClientRect();
        if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - 14;
        if (y + rect.height > window.innerHeight - 8) y = e.clientY - rect.height - 14;
        if (x < 8) x = 8;
        if (y < 8) y = 8;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
      }

      document.addEventListener('mouseover', function (e) {
        const cell = e.target.closest('.token-cell');
        if (cell) {
          tip.textContent = cell.dataset.full;
          tip.classList.add('show');
          return;
        }
        const pcell = e.target.closest('.providers-cell [data-tip]');
        if (pcell) {
          utip.innerHTML = pcell.dataset.tip || '';
          utip.classList.add('show');
          return;
        }
        const ucell = e.target.closest('.usage-cell');
        if (ucell) {
          utip.innerHTML = ucell.dataset.tip || '';
          utip.classList.add('show');
          return;
        }
        const lcell = e.target.closest('.limits-cell');
        if (lcell) {
          utip.innerHTML = lcell.dataset.tip || '';
          utip.classList.add('show');
        }
      });
      document.addEventListener('mousemove', function (e) {
        if (tip.classList.contains('show')) positionTip(tip, e);
        if (utip.classList.contains('show')) positionTip(utip, e);
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.closest && e.target.closest('.token-cell')) {
          tip.classList.remove('show');
        }
        if (e.target.closest && e.target.closest('.providers-cell [data-tip]')) {
          utip.classList.remove('show');
        }
        if (e.target.closest && e.target.closest('.usage-cell')) {
          utip.classList.remove('show');
        }
        if (e.target.closest && e.target.closest('.limits-cell')) {
          utip.classList.remove('show');
        }
      });
      document.addEventListener('click', function (e) {
        const cell = e.target.closest('.token-cell');
        if (cell && cell.dataset.full) {
          copyToken(cell.dataset.full);
          tip.classList.remove('show');
        }
      });
    })();

    function renderProviders(provs) {
      if (provs.includes('*')) return '<span class="tag tag-all">全部</span>';
      const tip = provs.map(p => `<div>${esc(p)}</div>`).join('');
      return `<span class="tag" data-tip="${escAttr('<div class="ut-title">提供商</div>' + tip)}">${provs.length}</span>`;
    }

    const RL_FIELDS = [
      ['rpm','RPM'], ['rph','RPH'], ['rpd','RPD'], ['rpw','RPW'], ['rpmo','RP月'], ['rpt','RPT'],
      ['tpm','TPM'], ['tph','TPH'], ['tpd','TPD'], ['tpw','TPW'], ['tpmo','TP月'], ['tpt','TPT']
    ];
    const TP_FIELD_SET = new Set(['tpm','tph','tpd','tpw','tpmo','tpt']);
    const WEIGHT_FIELDS = ['cache_read_weight', 'cache_write_weight'];

    function rateLimitsTooltip(t) {
      const rows = [];
      for (const [key, label] of RL_FIELDS) {
        const v = t[key];
        if (v === undefined || v === null || v === -1) continue;
        let display = v;
        if (TP_FIELD_SET.has(key)) {
          const m = v / 1e6;
          display = (Number.isInteger(m) ? m : m.toFixed(2)) + 'M';
        }
        rows.push(`<tr><td style="color:#8b949e;padding:2px 14px 2px 0">${label}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${display}</td></tr>`);
      }
      for (const key of WEIGHT_FIELDS) {
        const v = t[key];
        if (v === undefined || v === null || v === -1) continue;
        const label = key === 'cache_read_weight' ? 'cache_read 权重' : 'cache_write 权重';
        rows.push(`<tr><td style="color:#8b949e;padding:2px 14px 2px 0">${label}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${v}</td></tr>`);
      }
      if (!rows.length) return '<div class="ut-title">速率限制</div><div style="color:#8b949e">不限制</div>';
      return '<div class="ut-title">速率限制</div><table>' + rows.join('') + '</table>';
    }

    function renderRateLimits(t) {
      let n = 0;
      for (const [key] of RL_FIELDS) if (t[key] !== undefined && t[key] !== null && t[key] !== -1) n++;
      for (const key of WEIGHT_FIELDS) if (t[key] !== undefined && t[key] !== null && t[key] !== -1) n++;
      if (!n) return '<span style="color:#8b949e;font-size:11px">不限制</span>';
      return `<span class="rl-pill">⚙ ${n}</span>`;
    }

    function resetLimitInputs() {
      for (const [key] of RL_FIELDS) document.getElementById('modal-' + key).value = '-1';
      for (const key of WEIGHT_FIELDS) document.getElementById('modal-' + key).value = '-1';
    }

    function populateLimitInputs(t) {
      for (const [key] of RL_FIELDS) {
        const el = document.getElementById('modal-' + key);
        const v = t[key] ?? -1;
        if (v === -1) el.value = -1;
        else if (TP_FIELD_SET.has(key)) el.value = v / 1e6;
        else el.value = v;
      }
      for (const key of WEIGHT_FIELDS) {
        document.getElementById('modal-' + key).value = t[key] ?? -1;
      }
    }

    function readLimitInputs() {
      const limits = {};
      for (const [key] of RL_FIELDS) {
        const raw = document.getElementById('modal-' + key).value;
        if (raw === '' || raw === null) { limits[key] = -1; continue; }
        if (TP_FIELD_SET.has(key)) {
          const f = parseFloat(raw);
          limits[key] = isNaN(f) ? -1 : (f === -1 ? -1 : f);
        } else {
          const n = parseInt(raw, 10);
          limits[key] = isNaN(n) ? -1 : n;
        }
      }
      for (const key of WEIGHT_FIELDS) {
        const raw = document.getElementById('modal-' + key).value;
        if (raw === '' || raw === null) { limits[key] = -1; continue; }
        const f = parseFloat(raw);
        limits[key] = isNaN(f) ? -1 : f;
      }
      return limits;
    }

    function fmtNum(n) {
      n = Number(n) || 0;
      if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
      return String(n);
    }

    function hitRateCell(cr, inp) {
      const denom = (cr || 0) + (inp || 0);
      if (!denom) return '<td>-</td>';
      const r = (cr || 0) / denom;
      const pct = (r * 100).toFixed(1);
      const cls = r >= 0.95 ? 'ut-cr' : (r >= 0.8 ? 'ut-in' : 'ut-cw');
      return `<td class="${cls}">${pct}%</td>`;
    }

    function windowDetail(windowData) {
      const d = { input: 0, output: 0, cache_read: 0, cache_write: 0 };
      if (!windowData || !windowData.tokens) return d;
      for (const p in windowData.tokens) {
        const tk = windowData.tokens[p] || {};
        d.input += tk.input || 0;
        d.output += tk.output || 0;
        d.cache_read += tk.cache_read || 0;
        d.cache_write += tk.cache_write || 0;
      }
      return d;
    }

    function miniStack(d) {
      const total = (d.input || 0) + (d.output || 0) + (d.cache_read || 0) + (d.cache_write || 0);
      if (!total) return '<div class="mini-stack"></div>';
      const parts = [
        ['seg-in', d.input || 0],
        ['seg-out', d.output || 0],
        ['seg-cr', d.cache_read || 0],
        ['seg-cw', d.cache_write || 0],
      ].filter(([, v]) => v > 0);
      const segs = parts.map(([cls, v]) => {
        const w = (v / total * 100).toFixed(2);
        return `<div class="seg ${cls}" style="width:${w}%"></div>`;
      }).join('');
      return `<div class="mini-stack">${segs}</div>`;
    }

    function usageTooltip(windowData) {
      if (!windowData || !windowData.tokens) {
        return '<div class="ut-empty">暂无 token 用量数据</div>';
      }
      const tokens = windowData.tokens || {};
      const providers = Object.keys(tokens);
      if (providers.length === 0) {
        return '<div class="ut-empty">暂无 token 用量数据</div>';
      }
      const cell = (v, dotCls, valCls) => '<td class="' + (valCls || '') + '">' + fmtNum(v) + '</td>';
      let totIn = 0, totOut = 0, totCR = 0, totCW = 0;
      const rows = providers.map(p => {
        const tk = tokens[p] || {};
        totIn += tk.input || 0; totOut += tk.output || 0;
        totCR += tk.cache_read || 0; totCW += tk.cache_write || 0;
        return '<tr>'
          + '<td class="ut-prov">' + esc(p) + '</td>'
          + cell(tk.input, 'dot-in', 'ut-in')
          + cell(tk.output, 'dot-out', 'ut-out')
          + cell(tk.cache_read, 'dot-cr', 'ut-cr')
          + cell(tk.cache_write, 'dot-cw', 'ut-cw')
          + hitRateCell(tk.cache_read, tk.input)
          + '</tr>';
      });
      rows.push('<tr class="ut-total">'
        + '<td class="ut-prov">总计</td>'
        + cell(totIn, 'dot-in', 'ut-in')
        + cell(totOut, 'dot-out', 'ut-out')
        + cell(totCR, 'dot-cr', 'ut-cr')
        + cell(totCW, 'dot-cw', 'ut-cw')
        + hitRateCell(totCR, totIn)
        + '</tr>');
      const head = '<thead><tr>'
        + '<th>提供商</th>'
        + '<th>输入</th>'
        + '<th>输出</th>'
        + '<th>CR</th>'
        + '<th>CW</th>'
        + '<th>命中率</th>'
        + '</tr></thead>';
      return '<div class="ut-title">Token 用量</div><table>' + head + '<tbody>' + rows.join('') + '</tbody></table>';
    }

    const _adminClientLabels = {
      'claude-code': 'Claude Code', 'codex': 'Codex', 'opencode': 'OpenCode',
      'zcode': 'ZCode', 'cursor': 'Cursor', 'aider': 'Aider', 'cline': 'Cline',
      'roo-code': 'Roo Code', 'continue': 'Continue', 'github-copilot': 'GitHub Copilot',
      'gemini-cli': 'Gemini CLI', 'cody': 'Cody', 'windsurf': 'Windsurf',
      'kilo': 'Kilo', 'kilo-code': 'Kilo Code', 'qwen-code': 'Qwen Code',
      'crush': 'Crush', 'goose': 'Goose', 'serena': 'Serena',
      'python-openai': 'OpenAI SDK (Python)', 'node-openai': 'OpenAI SDK (Node)',
      'unknown': '未知'
    };
    function topClientLabel(u) {
      if (!u || !u.top_client) return '-';
      const c = u.top_client;
      return (_adminClientLabels[c.client] || c.client) + ' (' + (c.requests || 0) + ')';
    }
    function topClientTooltip(u) {
      if (!u || !u.clients || u.clients.length === 0) return '暂无客户端数据（最近 30 天）';
      return u.clients.map(c => (_adminClientLabels[c.client] || c.client) + ': ' + (c.requests || 0)).join('\n');
    }

    function renderRow(t, usageMap) {
      const adminBadge = t.is_admin ? '<span class="badge badge-admin">管理员</span>' : '<span class="badge badge-user">用户</span>';
      const shortToken = t.token.slice(0, 6);
      const u = usageMap[t.token] || {};
      const tokenNums = (wd) => {
        const d = windowDetail(wd);
        return `<span class="tk-in">${fmtNum(d.input)}</span> <span class="tk-out">${fmtNum(d.output)}</span> <span class="tk-cr">${fmtNum(d.cache_read)}</span>`;
      };
      return `<tr data-token="${esc(t.token)}">
    <td class="token-cell" data-full="${esc(t.token)}">${esc(shortToken)}...</td>
    <td style="font-size:12px;color:#8b949e;white-space:nowrap" title="${esc(t.describe || '')}">${esc(t.describe || '-')}</td>
    <td><div class="providers-cell">${renderProviders(t.providers)}</div></td>
    <td>${renderModels(t.models)}</td>
    <td>${adminBadge}</td>
    <td>
      <label class="toggle">
        <input type="checkbox" ${t.enabled ? 'checked' : ''} onchange="toggleEnabled(this, '${esc(t.token)}')">
        <span class="slider"></span>
      </label>
    </td>
    <td class="limits-cell" style="font-size:11px" data-tip="${escAttr(rateLimitsTooltip(t))}">${renderRateLimits(t)}</td>
    <td class="usage-cell" data-tip="${escAttr(usageTooltip(u['5h']))}"><div class="uc-num">${tokenNums(u['5h'])}</div>${miniStack(windowDetail(u['5h']))}</td>
    <td class="usage-cell" data-tip="${escAttr(usageTooltip(u['1d']))}"><div class="uc-num">${tokenNums(u['1d'])}</div>${miniStack(windowDetail(u['1d']))}</td>
    <td class="usage-cell" data-tip="${escAttr(usageTooltip(u['7d']))}"><div class="uc-num">${tokenNums(u['7d'])}</div>${miniStack(windowDetail(u['7d']))}</td>
    <td style="font-size:12px;color:#8b949e">${fmtDate(t.created_at)}</td>
    <td style="font-size:11px;color:${u.top_client && u.top_client.client !== 'unknown' ? '#79c0ff' : '#8b949e'}" title="${esc(topClientTooltip(u))}">${esc(topClientLabel(u))}</td>
    <td class="col-actions">
      <button class="btn btn-sm" onclick="showEditModal('${esc(t.token)}')">编辑</button>
      <button class="btn btn-sm" onclick="openUsage('${esc(t.token)}')">用量</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDelete('${esc(t.token)}')">删除</button>
    </td>
  </tr>`;
    }

    async function loadTokens() {
      const [tokensRes, usageRes] = await Promise.all([
        api('GET', '/admin/api/tokens'),
        api('GET', '/admin/api/tokens/usage'),
      ]);
      if (!tokensRes.ok) {
        toast(tokensRes.data.error || '加载 Token 失败');
        return;
      }
      const usageMap = usageRes.ok ? (usageRes.data.usage || {}) : {};
      const tbody = document.getElementById('token-tbody');
      if (!tokensRes.data.tokens || tokensRes.data.tokens.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" class="empty">暂无 Token</td></tr>';
      } else {
        tbody.innerHTML = tokensRes.data.tokens.map(t => renderRow(t, usageMap)).join('');
      }
      const total = tokensRes.data.tokens ? tokensRes.data.tokens.length : 0;
      const admins = tokensRes.data.tokens ? tokensRes.data.tokens.filter(t => t.is_admin).length : 0;
      document.getElementById('token-count').textContent = `共 ${total} 个 Token`;
      document.getElementById('stats').textContent = `${admins} 个管理员 / 共 ${total} 个`;
    }

    function buildProviderCheckboxes(containerId, selected) {
      const c = document.getElementById(containerId);
      const allOpts = ['*', ...PROVIDERS];
      c.innerHTML = allOpts.map(p => {
        const checked = selected.includes(p) ? 'checked' : '';
        return `<label><input type="checkbox" value="${esc(p)}" ${checked}>${esc(p === '*' ? '*（全部）' : p)}</label>`;
      }).join('');
    }

    function getSelectedProviders(containerId) {
      const checks = document.querySelectorAll(`#${containerId} input[type=checkbox]:checked`);
      const vals = Array.from(checks).map(c => c.value);
      return vals.includes('*') ? ['*'] : vals;
    }

    async function ensureCatalog() {
      const result = await api('GET', '/admin/api/models');
      if (result.ok) {
        catalogModels = (result.data.models || []).map(m => m.model);
      } else if (catalogModels === null) {
        catalogModels = [];
      }
    }

    function buildModelCheckboxes(containerId, selected) {
      const c = document.getElementById(containerId);
      const chosen = Array.isArray(selected) ? selected.slice() : [];
      const hasAll = chosen.includes('*');
      const ids = ['*'];
      for (const id of (catalogModels || [])) {
        if (!ids.includes(id)) ids.push(id);
      }
      for (const id of chosen) {
        if (!ids.includes(id)) ids.push(id);
      }
      c.innerHTML = ids.map(id => {
        const checked = hasAll ? id === '*' : chosen.includes(id);
        const label = id === '*' ? '*（全部模型）' : id;
        return `<label><input type="checkbox" value="${escAttr(id)}" ${checked ? 'checked' : ''}>${esc(label)}</label>`;
      }).join('');
      const hint = document.getElementById(containerId + '-hint');
      if (hint) {
        hint.textContent = (catalogModels && catalogModels.length)
          ? '勾选的 id 是该 Token 在 /v1/models 中唯一可见的模型。*（全部模型）会暴露整个目录。'
          : '模型目录为空，请先在模型目录中添加模型。';
      }
    }

    function getSelectedModels(containerId) {
      const checks = document.querySelectorAll(`#${containerId} input[type=checkbox]:checked`);
      const vals = Array.from(checks).map(c => c.value);
      return vals.includes('*') ? ['*'] : vals;
    }

    function renderModels(models) {
      const list = Array.isArray(models) ? models : [];
      if (list.includes('*')) return '<span class="tag tag-all">*（全部）</span>';
      if (list.length === 0) return '<span style="color:#8b949e;font-size:11px">无</span>';
      const text = list.join(', ');
      return `<span class="models-cell" title="${escAttr(text)}">${esc(text)}</span>`;
    }

    async function showCreateModal() {
      await ensureCatalog();
      editingToken = null;
      document.getElementById('modal-title').textContent = '新建 Token';
      document.getElementById('modal-token').value = '';
      document.getElementById('modal-token').disabled = false;
      document.getElementById('modal-describe').value = '';
      document.getElementById('modal-admin').checked = false;
      buildProviderCheckboxes('modal-providers', ['*']);
      buildModelCheckboxes('modal-models', ['*']);
      resetLimitInputs();
      document.getElementById('modal-submit').textContent = '创建';
      document.getElementById('modal-overlay').classList.add('active');
    }

    async function showEditModal(token) {
      const { ok, data } = await api('GET', '/admin/api/tokens');
      if (!ok) {
        toast(data.error || '加载 Token 失败');
        return;
      }
      const t = data.tokens ? data.tokens.find(x => x.token === token) : null;
      if (!t) return;
      await ensureCatalog();
      editingToken = token;
      document.getElementById('modal-title').textContent = '编辑 Token';
      document.getElementById('modal-token').value = token;
      document.getElementById('modal-token').disabled = false;
      document.getElementById('modal-describe').value = t.describe || '';
      document.getElementById('modal-admin').checked = t.is_admin;
      buildProviderCheckboxes('modal-providers', t.providers);
      buildModelCheckboxes('modal-models', Array.isArray(t.models) ? t.models : ['*']);
      populateLimitInputs(t);
      document.getElementById('modal-submit').textContent = '保存';
      document.getElementById('modal-overlay').classList.add('active');
    }

    function hideModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    async function submitModal() {
      const provs = getSelectedProviders('modal-providers');
      const models = getSelectedModels('modal-models');
      const isAdmin = document.getElementById('modal-admin').checked;
      const describe = document.getElementById('modal-describe').value.trim();
      const limits = readLimitInputs();
      if (!models.length) {
        toast('请至少选择一个可见模型');
        return;
      }
      let result;
      if (!editingToken) {
        const customToken = document.getElementById('modal-token').value.trim();
        result = await api('POST', '/admin/api/tokens', {
          token: customToken || undefined,
          providers: provs,
          models: models,
          is_admin: isAdmin,
          describe: describe,
          ...limits,
        });
      } else {
        const tokenValue = document.getElementById('modal-token').value.trim();
        result = await api('PUT', '/admin/api/tokens', {
          token: editingToken,
          new_token: tokenValue,
          providers: provs,
          models: models,
          is_admin: isAdmin,
          describe: describe,
          ...limits,
        });
      }
      if (!result.ok) {
        toast(result.data.error || '操作失败');
        return;
      }
      // 若被编辑的 token 已重命名，管理员重命名自己的 token 时保持会话有效。
      if (editingToken && result.data && result.data.token && result.data.token.token !== editingToken) {
        if (editingToken === adminToken) {
          adminToken = result.data.token.token;
          if (localStorage.getItem('admin_token')) {
            localStorage.setItem('admin_token', adminToken);
          }
        }
      }
      hideModal();
      await loadTokens();
      toast(editingToken ? 'Token 已更新' : 'Token 已创建', 'success');
    }

    async function toggleEnabled(checkbox, token) {
      const newVal = checkbox.checked;
      const result = await api('PUT', '/admin/api/tokens', {
        token: token,
        enabled: newVal,
      });
      if (!result.ok) {
        toast(result.data.error || '更新失败');
        checkbox.checked = !newVal;
        return;
      }
      await loadTokens();
    }

    let _confirmResolve = null;

    function showConfirm(msg) {
      document.getElementById('confirm-message').textContent = msg;
      document.getElementById('confirm-overlay').classList.add('active');
      return new Promise(resolve => { _confirmResolve = resolve; });
    }

    function confirmOk() {
      document.getElementById('confirm-overlay').classList.remove('active');
      if (_confirmResolve) { _confirmResolve(true); _confirmResolve = null; }
    }

    function confirmCancel() {
      document.getElementById('confirm-overlay').classList.remove('active');
      if (_confirmResolve) { _confirmResolve(false); _confirmResolve = null; }
    }

    async function confirmDelete(token) {
      const ok = await showConfirm('删除 Token ' + token.slice(0, 20) + '…？');
      if (ok) {
        await deleteToken(token);
      }
    }

    function openUsage(token) {
      const row = document.querySelector(`tr[data-token="${CSS.escape(token)}"]`);
      const desc = row ? (row.querySelector('td:nth-child(2)')?.title || '') : '';
      localStorage.setItem('_usage_token', JSON.stringify({ t: token, d: desc }));
      window.open('/usage', '_blank');
    }

    async function deleteToken(token) {
      const result = await api('DELETE', '/admin/api/tokens', { token });
      if (!result.ok) {
        toast(result.data.error || '删除失败');
        return;
      }
      await loadTokens();
      toast('Token 已删除', 'success');
    }

    document.getElementById('modal-models').addEventListener('change', function (e) {
      const box = e.target;
      if (box.type !== 'checkbox') return;
      if (box.value === '*' && box.checked) {
        this.querySelectorAll('input[type=checkbox]').forEach(x => {
          if (x.value !== '*') x.checked = false;
        });
      } else if (box.value !== '*' && box.checked) {
        const all = this.querySelector('input[value="*"]');
        if (all) all.checked = false;
      }
    });

    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) hideModal();
    });

    async function doLogin() {
      const token = document.getElementById('login-token').value.trim();
      if (!token) {
        document.getElementById('login-error').textContent = '请输入管理员 Token';
        return;
      }
      document.getElementById('login-error').textContent = '';
      try {
        const resp = await fetch('/admin/api/tokens', {
          headers: { 'X-Admin-Token': token },
        });
        if (resp.status === 403) {
          document.getElementById('login-error').textContent = '管理员 Token 无效';
          return;
        }
        if (!resp.ok) {
          document.getElementById('login-error').textContent = '登录失败';
          return;
        }
        adminToken = token;
        localStorage.setItem('admin_token', document.getElementById('login-remember').checked ? token : '');
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('admin-content').classList.add('active');
        await ensureCatalog();
        loadTokens();
      } catch (e) {
        document.getElementById('login-error').textContent = '网络错误';
      }
    }

    function doLogout() {
      adminToken = null;
      catalogModels = null;
      localStorage.removeItem('admin_token');
      document.getElementById('login-token').value = '';
      document.getElementById('login-overlay').classList.remove('hidden');
      document.getElementById('admin-content').classList.remove('active');
    }

    document.getElementById('login-token').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    (function autoLogin() {
      const saved = localStorage.getItem('admin_token');
      if (saved) {
        document.getElementById('login-token').value = saved;
        document.getElementById('login-remember').checked = true;
        doLogin();
      }
    })();
  </script>
